name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Test before release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run tests
        run: swift test

  release:
    name: Build & publish
    needs: test
    permissions:
      contents: write
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Package Tico.app
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a release tag such as v1.0.11'; exit 1; }
          TICO_UNIVERSAL=1 VERSION="${GITHUB_REF_NAME#v}" ./scripts/package.sh --stable

      - name: Zip the app
        run: |
          ditto -c -k --keepParent dist/stable/Tico.app dist/Tico.zip
          (cd dist && shasum -a 256 Tico.zip > Tico.zip.sha256 && shasum -a 256 -c Tico.zip.sha256)
          mkdir -p "$RUNNER_TEMP/tico-release-check"
          ditto -x -k dist/Tico.zip "$RUNNER_TEMP/tico-release-check"
          codesign --verify --deep --strict "$RUNNER_TEMP/tico-release-check/Tico.app"
          lipo -verify_arch arm64 x86_64 "$RUNNER_TEMP/tico-release-check/Tico.app/Contents/MacOS/Tic"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$RUNNER_TEMP/tico-release-check/Tico.app/Contents/Info.plist")" = "${GITHUB_REF_NAME#v}"

      - name: Build DMG
        run: |
          STAGING="$(mktemp -d)"
          cp -R dist/stable/Tico.app "$STAGING/Tico.app"
          ln -s /Applications "$STAGING/Applications"   # drag-to-install layout
          hdiutil create -volname "Tico" -srcfolder "$STAGING" -ov -format UDZO \
            "dist/Tico-${GITHUB_REF_NAME}.dmg"

      - name: Ensure release notes are non-empty
        run: '[ -s RELEASE_NOTES.md ] || echo "Release ${GITHUB_REF_NAME}" > RELEASE_NOTES.md'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Tico ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/Tico-${{ github.ref_name }}.dmg
            dist/Tico.zip
            dist/Tico.zip.sha256

  changelog:
    name: Update CHANGELOG.md
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Regenerate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if ! git diff --staged --quiet; then
            git commit -m "docs(changelog): update for ${GITHUB_REF_NAME} [skip ci]"
            git push origin main
          fi
