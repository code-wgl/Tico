name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['site/**']
  pull_request:
    paths-ignore: ['site/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (release)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version
      - name: Build and package
        run: TICO_UNIVERSAL=1 ./scripts/package.sh --stable
      - name: Archive and verify package
        run: |
          set -euo pipefail
          ditto -c -k --keepParent dist/stable/Tico.app dist/Tico.zip
          (cd dist && shasum -a 256 Tico.zip > Tico.zip.sha256 && shasum -a 256 -c Tico.zip.sha256)
          mkdir -p "$RUNNER_TEMP/tico-package-check"
          ditto -x -k dist/Tico.zip "$RUNNER_TEMP/tico-package-check"
          codesign --verify --deep --strict "$RUNNER_TEMP/tico-package-check/Tico.app"
          lipo -verify_arch arm64 x86_64 "$RUNNER_TEMP/tico-package-check/Tico.app/Contents/MacOS/Tic"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleName' "$RUNNER_TEMP/tico-package-check/Tico.app/Contents/Info.plist")" = Tico
          mkdir -p "$RUNNER_TEMP/tico-dmg"
          ditto dist/stable/Tico.app "$RUNNER_TEMP/tico-dmg/Tico.app"
          ln -s /Applications "$RUNNER_TEMP/tico-dmg/Applications"
          hdiutil create -volname Tico -srcfolder "$RUNNER_TEMP/tico-dmg" -format UDZO dist/Tico.dmg
          hdiutil verify dist/Tico.dmg
          (cd dist && shasum -a 256 Tico.dmg > Tico.dmg.sha256 && shasum -a 256 -c Tico.dmg.sha256)
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: Tico-macOS-${{ github.sha }}
          path: |
            dist/Tico.zip
            dist/Tico.zip.sha256
            dist/Tico.dmg
            dist/Tico.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: swift test

  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        run: command -v swiftlint >/dev/null 2>&1 || brew install swiftlint
      - name: SwiftLint
        run: swiftlint lint --reporter github-actions-logging
