name: Feature request
description: Suggest an improvement to Tico.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Describe your idea
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
