name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Test before release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run tests
        run: swift test

  release:
    name: Build & publish
    needs: test
    permissions:
      contents: write
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Package Tico.app
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a release tag such as v1.0.11'; exit 1; }
          TICO_UNIVERSAL=1 VERSION="${GITHUB_REF_NAME#v}" BUILD_VERSION="${GITHUB_REF_NAME#v}" ./scripts/package.sh --stable

      - name: Zip the app
        run: |
          ditto -c -k --keepParent dist/stable/Tico.app dist/Tico.zip
          (cd dist && shasum -a 256 Tico.zip > Tico.zip.sha256 && shasum -a 256 -c Tico.zip.sha256)
          mkdir -p "$RUNNER_TEMP/tico-release-check"
          ditto -x -k dist/Tico.zip "$RUNNER_TEMP/tico-release-check"
          codesign --verify --deep --strict "$RUNNER_TEMP/tico-release-check/Tico.app"
          lipo "$RUNNER_TEMP/tico-release-check/Tico.app/Contents/MacOS/Tic" -verify_arch arm64 x86_64
          cmp Sources/Tic/Resources/MenuBarIcon.png "$RUNNER_TEMP/tico-release-check/Tico.app/Contents/Resources/MenuBarIcon.png"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$RUNNER_TEMP/tico-release-check/Tico.app/Contents/Info.plist")" = "${GITHUB_REF_NAME#v}"

      - name: Build DMG
        run: |
          STAGING="$(mktemp -d)"
          cp -R dist/stable/Tico.app "$STAGING/Tico.app"
          ln -s /Applications "$STAGING/Applications"   # drag-to-install layout
          hdiutil create -volname "Tico" -srcfolder "$STAGING" -ov -format UDZO \
            "dist/Tico-${GITHUB_REF_NAME}.dmg"
          hdiutil verify "dist/Tico-${GITHUB_REF_NAME}.dmg"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Tico ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Universal macOS build for Apple Silicon and Intel. This build is ad-hoc signed and is not notarized by Apple. See the README for installation and data compatibility details.
          files: |
            dist/Tico-${{ github.ref_name }}.dmg
            dist/Tico.zip
            dist/Tico.zip.sha256
