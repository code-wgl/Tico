name: Bug report
description: Report a reproducible problem with Tico.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead. Avoid sharing private note contents.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Tico
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tico version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional context
      description: Add screenshots or logs after removing private information.
